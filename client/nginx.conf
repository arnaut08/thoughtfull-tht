server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API access, so the browser needs no CORS setup.
  # ${API_UPSTREAM} is filled in at container start (see the nginx image's
  # envsubst templates). Defaults to the compose service; on Railway, point it
  # at the server's private or public address. No URI part in proxy_pass, so
  # the /api prefix is forwarded unchanged.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
