services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    env_file:
      - .env
    # Must match the upstream port in client/nginx.conf.
    environment:
      PORT: "3001"

  client:
    build:
      context: ./client
      args:
        # Inlined at build time; "/api" routes through the nginx proxy to the server.
        VITE_API_URL: /api
    ports:
      - "80:80"
    environment:
      # Use the compose service hostname locally; Railway overrides this
      # runtime setting with the server's public API URL.
      API_UPSTREAM: http://server:3001
    depends_on:
      - server